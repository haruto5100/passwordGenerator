<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード自動生成ツール</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <main class="panel">
            <header class="topbar">
                <div class="brand" aria-label="セキュリティツールのブランド">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <div>
                        <h1>パスワード自動生成</h1>
                    </div>
                </div>
            </header>

            <section class="generator-layout">
                <div class="settings-panel">
                    <div class="panel-header">
                        <h2>生成条件</h2>
                    </div>

                    <label class="field-block" for="passwordLength">
                        <span>長さ</span>
                        <div class="length-control">
                            <input type="number" id="passwordLength" value="16" min="8" max="64" aria-label="パスワードの長さ">
                            <em>chars</em>
                        </div>
                    </label>

                    <div class="options-container" aria-label="文字種の選択">
                        <label class="option-card" for="includeUpper">
                            <input type="checkbox" id="includeUpper" checked>
                            <span>英大文字</span>
                        </label>

                        <label class="option-card" for="includeLower">
                            <input type="checkbox" id="includeLower" checked>
                            <span>英小文字</span>
                        </label>

                        <label class="option-card" for="includeNumbers">
                            <input type="checkbox" id="includeNumbers" checked>
                            <span>数字</span>
                        </label>

                        <label class="option-card" for="includeSymbols">
                            <input type="checkbox" id="includeSymbols" checked>
                            <span>記号</span>
                        </label>
                    </div>

                    <button id="generateButton" type="button">生成</button>
                </div>

                <section id="result" class="result-panel" aria-live="polite">
                    <div class="panel-header result-header">
                        <div>
                            <h2>結果</h2>
                        </div>
                        <button id="copyButton" type="button" class="secondary-button">コピー</button>
                    </div>

                    <div class="password-box">
                        <input type="text" id="generatedPassword" value="生成ボタンを押してください" readonly aria-label="生成されたパスワード">
                    </div>

                    <div id="strengthOutput" class="analysis-box">
                        <h3>パスワード強度分析</h3>
                        <p>ここにパスワードの安全性に関する評価とクラック推定時間が表示されます。</p>
                    </div>
                </section>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
